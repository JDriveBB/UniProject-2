    bindings:
      $ref: '#/components/channelBindings/eventos'
operations:
  publicarTareaRutaCriticaRiesgo:
    action: send
    summary: El programador interno detecta que una tarea de la ruta crítica pasó a estar en riesgo (RF4, RF9).
    channel:
      $ref: '#/channels/tareaRutaCriticaRiesgo'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarEquipoInactividad:
    action: send
    summary: El programador interno detecta un estudiante sin actividad durante el periodo configurado (RF6).
    channel:
      $ref: '#/channels/equipoInactividad'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarHitoEnviado:
    action: send
    summary: Un estudiante envía un hito a revisión (RF7).
    channel:
      $ref: '#/channels/hitoEnviado'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarHitoEvaluado:
    action: send
    summary: El docente evalúa un hito; viaja solo el carácter de la nota, no la nota (RF8, Ley 1581).
    channel:
      $ref: '#/channels/hitoEvaluado'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarTareaReasignada:
    action: send
    summary: El líder reasigna una tarea a otro integrante (RF11).
    channel:
      $ref: '#/channels/tareaReasignada'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarTareaCorreccion:
    action: send
    summary: El líder pide rehacer la entrega de una tarea (RF5).
    channel:
      $ref: '#/channels/tareaCorreccion'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarCuentaRecuperacionSolicitada:
    action: send
    summary: Alguien pide restablecer la contraseña de una cuenta con Telegram vinculado (bloque 28). Sin el código.
    channel:
      $ref: '#/channels/cuentaRecuperacionSolicitada'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarCuentaContrasenaCambiada:
    action: send
    summary: La contraseña se cambió desde el perfil o con un enlace de recuperación; aviso de seguridad al titular.
    channel:
      $ref: '#/channels/cuentaContrasenaCambiada'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarCursoEstudianteAgregado:
    action: send
    summary: El docente agrega a un curso una cuenta que ya existe; avisa al estudiante (bloque 50).
    channel:
      $ref: '#/channels/cursoEstudianteAgregado'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarEquipoVotacionAbierta:
    action: send
    summary: Se abre una votación de líder (al cierre de equipos, a demanda o al destituir); avisa a los integrantes.
    channel:
      $ref: '#/channels/equipoVotacionAbierta'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarEquipoLiderElegido:
    action: send
    summary: Una votación termina con ganador o el docente desempata; avisa al equipo y al docente.
    channel:
      $ref: '#/channels/equipoLiderElegido'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarEquipoSinLider:
    action: send
    summary: Una votación termina en empate o sin votos; avisa al docente.
    channel:
      $ref: '#/channels/equipoSinLider'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarEquipoMiembroCambio:
    action: send
    summary: Alguien entra o sale de un equipo; avisa a los demás integrantes y a quien el docente metió.
    channel:
      $ref: '#/channels/equipoMiembroCambio'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarEquipoInscripcionPorCerrar:
    action: send
    summary: Faltan 24 horas para el cierre de equipos; avisa a los participantes sin equipo.
    channel:
      $ref: '#/channels/equipoInscripcionPorCerrar'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
  publicarEquipoInscripcionResumen:
    action: send
    summary: Faltan 24 horas para el cierre de equipos; resumen con conteos para el docente.
    channel:
      $ref: '#/channels/equipoInscripcionResumen'
    bindings:
      $ref: '#/components/operationBindings/publicacion'
components:
  channelBindings:
    eventos:
      amqp:
        is: routingKey
        exchange:
          name: uniproject.eventos
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  operationBindings:
    publicacion:
      amqp:
        deliveryMode: 2
        mandatory: false
        bindingVersion: 0.3.0
  messages:
    TareaRutaCriticaRiesgo:
      name: tarea.ruta_critica.riesgo
      title: Tarea de la ruta crítica en riesgo
      contentType: application/cloudevents+json
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: '../../eventos-contrato/src/main/resources/esquemas/tarea.ruta_critica.riesgo.schema.json'
    EquipoInactividad:
