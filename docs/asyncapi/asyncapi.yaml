asyncapi: 3.0.0
info:
  title: Eventos de UniProject
  version: 1.0.0
  description: |
    Eventos que el núcleo de UniProject publica en RabbitMQ 4.3 a través de la outbox (tabla Evento_Saliente):
    un publicador por sondeo los envía al exchange topic uniproject.eventos con confirmaciones del broker.
    El agente de Telegram los recibe desde la quorum queue notificaciones.telegram (enlazada con la clave #),
    con confirmación manual, reintento diferido y cola de fallidos notificaciones.telegram.fallidos.
    Cada mensaje es un CloudEvent 1.0 en modo estructurado. Los JSON Schema (draft-07) del módulo
    eventos-contrato son la fuente de verdad; este documento los referencia. Los dos eventos de cuenta
    (bloque 28) no llevan secretos: el código de recuperación lo pide el agente al núcleo por el endpoint
    interno justo antes de enviarlo. Los siete eventos de cursos y equipos (bloque 50) llevan solo ids,
    nombres y conteos.
  license:
    name: Uso académico - Diseño de Software I
defaultContentType: application/cloudevents+json
servers:
  broker:
    host: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ 4.3 (servicio rabbitmq de Docker Compose), vhost /.
channels:
  tareaRutaCriticaRiesgo:
    address: tarea.ruta_critica.riesgo
    messages:
      tareaRutaCriticaRiesgo:
        $ref: '#/components/messages/TareaRutaCriticaRiesgo'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  equipoInactividad:
    address: equipo.inactividad
    messages:
      equipoInactividad:
        $ref: '#/components/messages/EquipoInactividad'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  hitoEnviado:
    address: hito.enviado
    messages:
      hitoEnviado:
        $ref: '#/components/messages/HitoEnviado'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  hitoEvaluado:
    address: hito.evaluado
    messages:
      hitoEvaluado:
        $ref: '#/components/messages/HitoEvaluado'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  tareaReasignada:
    address: tarea.reasignada
    messages:
      tareaReasignada:
        $ref: '#/components/messages/TareaReasignada'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  tareaCorreccion:
    address: tarea.correccion
    messages:
      tareaCorreccion:
        $ref: '#/components/messages/TareaCorreccion'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  cuentaRecuperacionSolicitada:
    address: cuenta.recuperacion.solicitada
    messages:
      cuentaRecuperacionSolicitada:
        $ref: '#/components/messages/CuentaRecuperacionSolicitada'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  cuentaContrasenaCambiada:
    address: cuenta.contrasena.cambiada
    messages:
      cuentaContrasenaCambiada:
        $ref: '#/components/messages/CuentaContrasenaCambiada'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  cursoEstudianteAgregado:
    address: curso.estudiante_agregado
    messages:
      cursoEstudianteAgregado:
        $ref: '#/components/messages/CursoEstudianteAgregado'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  equipoVotacionAbierta:
    address: equipo.votacion_abierta
    messages:
      equipoVotacionAbierta:
        $ref: '#/components/messages/EquipoVotacionAbierta'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  equipoLiderElegido:
    address: equipo.lider_elegido
    messages:
      equipoLiderElegido:
        $ref: '#/components/messages/EquipoLiderElegido'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  equipoSinLider:
    address: equipo.sin_lider
    messages:
      equipoSinLider:
        $ref: '#/components/messages/EquipoSinLider'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  equipoMiembroCambio:
    address: equipo.miembro_cambio
    messages:
      equipoMiembroCambio:
        $ref: '#/components/messages/EquipoMiembroCambio'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  equipoInscripcionPorCerrar:
    address: equipo.inscripcion_por_cerrar
    messages:
      equipoInscripcionPorCerrar:
        $ref: '#/components/messages/EquipoInscripcionPorCerrar'
    bindings:
      $ref: '#/components/channelBindings/eventos'
  equipoInscripcionResumen:
    address: equipo.inscripcion_resumen
    messages:
      equipoInscripcionResumen:
