# Administrador del panel. Se crea solo cuando el nodo arranca con la base vacía.
# Las variables vienen del entorno del contenedor (interpolación $(VAR) de rabbitmq.conf).
default_user = $(RABBITMQ_ADMIN_USER)
default_pass = $(RABBITMQ_ADMIN_PASSWORD)
default_user_tags.administrator = true
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*
